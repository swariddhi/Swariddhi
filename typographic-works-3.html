<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typographic Works III</title>

    <!-- Your existing stylesheet -->
    <link rel="stylesheet" href="style.css">


    <style>

        /* =========================
           PROJECT PAGE
        ========================= */

        .project-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Project content */

        .project-content {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
            gap: 70px;
            margin-top: 45px;
        }

        /* Images */

        .project-images {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .project-images img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Project information */

        .project-info {
            padding-top: 25px;
        }

        .project-info  {
            margin: 0 0 35px 0;
            font-size: 38px;
            line-height: 1.1;
            font-weight: 600;
        }

        .project-info p {
            margin: 0;
            max-width: 430px;
            font-size: 16px;
            line-height: 1.8;
            font-weight: 400;
        }

        /* Previous / Next */

        .project-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 75px;
            padding-bottom: 100px;
            font-size: 17px;
        }

        .project-navigation a {
            color: inherit;
            text-decoration: none;
        }

        .project-navigation a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 800px) {

            .project-page {
                padding: 0 20px;
            }

            .project-content {
                grid-template-columns: 1fr;
                gap: 40px;
                margin-top: 30px;
            }

            .project-info {
                order: -1;
                padding-top: 0;
            }

            .project-info  {
                font-size: 30px;
                margin-bottom: 20px;
            }

            .project-info p {
                font-size: 15px;
                line-height: 1.7;
            }

            .project-navigation {
                margin-top: 50px;
                padding-bottom: 60px;
                font-size: 15px;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header class="site-header">

        <nav class="main-nav">
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

        <a href="index.html" class="site-title">
            Your Name
        </a>

        <div class="social-icons">
            <a href="#" aria-label="Instagram">◎</a>
        </div>

    </header>


    <!-- =========================
         PROJECT
         ========================= -->

    <main class="project-page">

        <div class="project-content">

            <!-- LEFT: PROJECT IMAGES -->

            <div class="project-images">

                <img src="assets/skate1.jpg" alt="Skate">

                <img src="images/project-2.jpg" alt="Project image">

                <img src="images/project-3.jpg" alt="Project image">

            </div>


            <!-- RIGHT: PROJECT INFORMATION -->

            <div class="project-info">

                <h1>
                    Typographic<br>
                    Works III
                </h1>

                <p>
                    This project contrasts the raw, organic energy of brushed script with the calculated precision of geometric letterforms.
                </p>

            </div>

        </div>


        <!-- =========================
             PREVIOUS / NEXT
             ========================= -->

        <div class="project-navigation">

            <a href="project-previous.html">
                ← Previous Project
            </a>

            <a href="project-next.html">
                Next Project →
            </a>

        </div>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="site-footer">

        <div class="footer-links">
            <a href="index.html">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>

        <p>
            © 2026 Your Name
        </p>

    </footer>


</body>
</html>
